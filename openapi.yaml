paths:
  /auth/token:
    post:
      tags: [Authorization]
      summary: Generate an access token
      operationId: generateToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id:
                  type: string
                  example: tpex-ingestion
                client_secret:
                  type: string
                  example: s3cr3t-value
      responses:
        "200":
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_at]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_at:
                    type: string
                    format: date-time
              example:
                access_token: 7|q3VbX9mZk2LpR8wT4nYc6JhD1sFa0GeU5iOo
                token_type: Bearer
                expires_at: "2026-10-05T10:30:00+00:00"
        "401":
          description: Invalid client credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid client credentials
        "422":
          $ref: "#/components/responses/ValidationError"

  /buildings:
    get:
      tags: [Buildings]
      summary: List buildings
      description: Buildings the authenticated client has access to. 50 per page.
      operationId: listBuildings
      security:
        - bearer_token: []
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Building"
              example:
                data:
                  - building_id: 101
                    building_name: Harbour Offices
                    building_code: AMS-HO
                    address: Pieter Heinkade 12, 1019 AB Amsterdam
                    currency: EUR
                    company_id: 7
                  - building_id: 102
                    building_name: Stadium Tower
                    building_code: AMS-ST
                    address: Burgerweeshuispad 301, 1076 GR Amsterdam
                    currency: EUR
                    company_id: 7
                  - building_id: 215
                    building_name: Spree Campus
                    building_code: null
                    address:
                      street: Stralauer Allee 2
                      postal_code: "10245"
                      city: Berlin
                      country: DE
                    currency: EUR
                    company_id: 7
                links:
                  first: http://127.0.0.1:4010/buildings?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  per_page: 50
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tickets/categories:
    get:
      tags: [Tickets]
      summary: List ticket categories
      description: |
        All ticket categories. Categories form a tree via `parent_id` (`null` for root
        categories). Not paginated.
      operationId: listTicketCategories
      security:
        - bearer_token: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
              example:
                data:
                  - { id: 1, parent_id: null, company_id: 7, name: HVAC }
                  - { id: 11, parent_id: 1, company_id: 7, name: Heating }
                  - { id: 12, parent_id: 1, company_id: 7, name: Ventilation }
                  - { id: 2, parent_id: null, company_id: 7, name: Plumbing }
                  - { id: 21, parent_id: 2, company_id: 7, name: Leakage }
                  - {
                      id: 3,
                      parent_id: null,
                      company_id: 7,
                      name: Access control,
                    }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets
      description: |
        Tickets of all buildings the client has access to, **newest first** (by `id`
        descending). 50 per page. Deleted tickets are not returned.
      operationId: listTickets
      security:
        - bearer_token: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: building_ids[]
          in: query
          description: Only return tickets for these buildings.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Ticket"
              examples:
                last_page:
                  summary: A single (last) page
                  value:
                    data:
                      - *open_ticket
                      - *closed_ticket
                      - *sparse_ticket
                      - *on_hold_ticket
                    links:
                      first: http://127.0.0.1:4010/tickets?page=1
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      per_page: 50
                first_of_many:
                  summary: First page with more pages available
                  value:
                    data:
                      - *open_ticket
                    links:
                      first: http://127.0.0.1:4010/tickets?page=1
                      prev: null
                      next: http://127.0.0.1:4010/tickets?page=2
                    meta:
                      current_page: 1
                      per_page: 50
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tickets/{ticket_id}:
    get:
      tags: [Tickets]
      summary: Show ticket
      operationId: showTicket
      security:
        - bearer_token: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Ticket"
              examples:
                open_ticket:
                  value:
                    data: *open_ticket
                closed_ticket:
                  value:
                    data: *closed_ticket
                sparse_ticket:
                  value:
                    data: *sparse_ticket
                on_hold_ticket:
                  value:
                    data: *on_hold_ticket
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tickets/{ticket_id}/activities:
    get:
      tags: [Tickets]
      summary: List ticket activities
      description: |
        Audit trail of a ticket (status changes, assignments, emails sent), oldest first.
      operationId: listTicketActivities
      security:
        - bearer_token: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Activity"
              example:
                data:
                  - id: 880001
                    ticket_id: 48213
                    message: Ticket created
                    data: []
                    creator:
                      id: 3021
                      full_name: Sanne de Vries
                      email: sanne.devries@tenant-co.example
                      company_id: 55
                      company_name: Tenant Co
                    created_at: "2026-10-01T08:12:44+02:00"
                    emails: []
                  - id: 880017
                    ticket_id: 48213
                    message: Status changed from ISSUE_REPORTED to AWAITING_SUPPLIER_CONFIRMATION
                    data:
                      from: ISSUE_REPORTED
                      to: AWAITING_SUPPLIER_CONFIRMATION
                      supplier_id: 912
                    creator:
                      id: 17
                      full_name: Mark Jansen
                      email: mark.jansen@tpex.example
                      company_id: 7
                      company_name: TPEX
                    created_at: "2026-10-01T06:40:03+00:00"
                    emails:
                      - id: 5501
                        sender_email: noreply@facilitydesk.example
                        recipient_email: planning@coolair.example
                        carbon_copies: [mark.jansen@tpex.example]
                        subject: "New work order #48213: No heating on 4th floor"
                        email_content: "Dear supplier, a new work order has been assigned to you..."
                  - id: 880020
                    ticket_id: "48213"
                    message: Deadline updated
                    data:
                      deadline_at: "2026-10-03T17:00:00+02:00"
                    creator: null
                    created_at: "2026-10-01T06:40:05+00:00"
                    emails: []
                links:
                  first: http://127.0.0.1:4010/tickets/48213/activities?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  per_page: 20
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tickets/{ticket_id}/chats/{chat_type}/messages:
    get:
      tags: [Tickets]
      summary: List ticket chat messages
      description: |
        Each ticket has one chat per `chat_type`. Messages are returned oldest first.
        Most tickets only use one or two chat types; the others return an empty list.
      operationId: listTicketChatMessages
      security:
        - bearer_token: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: chat_type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ChatType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChatMessage"
              examples:
                with_messages:
                  value:
                    data:
                      - id: 330101
                        ticket_chat_id: 9120
                        message: "The radiators on the 4th floor are cold since this morning."
                        author:
                          name: Sanne de Vries
                          profile_photo: null
                        sent_at: "2026-10-01T08:13:10+02:00"
                        files:
                          - url: https://files.facilitydesk.example/t/48213/radiator.jpg
                            name: radiator.jpg
                        mentions: []
                      - id: 330188
                        ticket_chat_id: 9120
                        message: "@Sanne de Vries a technician from CoolAir will visit tomorrow at 09:00."
                        author:
                          name: Mark Jansen
                          thumbnail: https://files.facilitydesk.example/u/17.png
                        sent_at: "2026-10-01T07:02:51+00:00"
                        files: []
                        mentions:
                          - user_mentioned_id: 3021
                            user_mentioned_full_name: Sanne de Vries
                            mentioned_by_id: 17
                    links:
                      first: http://127.0.0.1:4010/tickets/48213/chats/TECHNICAL_MANAGER_AND_TENANT/messages?page=1
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      per_page: 20
                empty:
                  value:
                    data: []
                    links:
                      first: http://127.0.0.1:4010/tickets/48213/chats/ANNOUNCEMENT/messages?page=1
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      per_page: 20
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    bearer_token:
      type: http
      scheme: bearer

  parameters:
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthenticated:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Unauthenticated.
    TicketNotFound:
      description: Ticket does not exist, was deleted, or is not accessible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Ticket not found
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 23
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Too Many Attempts.
    ValidationError:
      description: Validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            message: The given data was invalid.
            errors:
              building_ids: [The building ids must be an array.]

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Paginated:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {}
        links:
          type: object
          properties:
            first:
              type: string
              format: uri
            prev:
              type: string
              format: uri
              nullable: true
            next:
              type: string
              format: uri
              nullable: true
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer

    Building:
      type: object
      required: [building_id, building_name, company_id]
      properties:
        building_id:
          type: integer
          format: int64
        building_name:
          type: string
        building_code:
          type: string
          nullable: true
          description: Short internal reference.
        address:
          type: string
          nullable: true
        currency:
          type: string
          description: ISO 4217 currency code.
        company_id:
          type: integer
          format: int64

    Category:
      type: object
      required: [id, name, company_id]
      properties:
        id:
          type: integer
          format: int64
        parent_id:
          type: integer
          format: int64
          nullable: true
        company_id:
          type: integer
          format: int64
        name:
          type: string

    TicketStep:
      type: string
      description: |
        Workflow step of a ticket.
        - Open: `ISSUE_REPORTED`
        - In progress: `AWAITING_SUPPLIER_CONFIRMATION`, `DRAFT_WORK_ORDER`,
          `REVIEWING_WORK_ORDER`, `VISIT_SCHEDULED`, `AWAITING_NEW_SITE_VISIT_SCHEDULE`,
          `REVIEWING_FIX`
        - Closed: `ISSUE_CLOSED`, `REJECTED`, `REJECTED_BY_SUPPLIER`
      enum:
        - ISSUE_REPORTED
        - AWAITING_SUPPLIER_CONFIRMATION
        - DRAFT_WORK_ORDER
        - REVIEWING_WORK_ORDER
        - VISIT_SCHEDULED
        - AWAITING_NEW_SITE_VISIT_SCHEDULE
        - REVIEWING_FIX
        - ISSUE_CLOSED
        - REJECTED
        - REJECTED_BY_SUPPLIER

    TicketUser:
      type: object
      required: [id, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        role:
          type: string
          enum: [OWNER, TENANT, SUPPLIER, FOLLOWER]

    Ticket:
      type: object
      required: [id, title, current_step, building_id, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        category_id:
          type: integer
          format: int64
          nullable: true
        category_name:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
          enum: [LOW, MEDIUM, HIGH, CRITICAL, null]
        current_step:
          $ref: "#/components/schemas/TicketStep"
        building_id:
          type: integer
          format: int64
        building_name:
          type: string
        exact_location:
          type: string
          nullable: true
          description: Free text, e.g. floor and unit.
        supplier_name:
          type: string
          nullable: true
        tenant_company_name:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
          enum: [phone, email, site_visit, portal, null]
        deadline_at:
          type: string
          format: date-time
          nullable: true
        site_visit_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        users:
          type: array
          items:
            $ref: "#/components/schemas/TicketUser"

    ActivityEmail:
      type: object
      required: [id, sender_email, recipient_email]
      properties:
        id:
          type: integer
          format: int64
        sender_email:
          type: string
          format: email
        recipient_email:
          type: string
          format: email
        carbon_copies:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
          nullable: true
        email_content:
          type: string
          nullable: true

    Activity:
      type: object
      required: [id, ticket_id, message, created_at]
      properties:
        id:
          type: integer
          format: int64
        ticket_id:
          type: integer
          format: int64
        message:
          type: string
          description: Human readable description of what happened.
        data:
          type: object
          additionalProperties: true
          description: Free-form, depends on the activity type.
        creator:
          type: object
          nullable: true
          description: "`null` for system-generated activities."
          required: [id]
          properties:
            id:
              type: integer
              format: int64
            full_name:
              type: string
              nullable: true
            email:
              type: string
              format: email
              nullable: true
            company_id:
              type: integer
              format: int64
              nullable: true
            company_name:
              type: string
              nullable: true
        created_at:
          type: string
          format: date-time
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEmail"

    ChatType:
      type: string
      enum:
        - SUPPLIER_AND_TENANT
        - INTERNAL_TEAM
        - TECHNICAL_MANAGER_AND_SUPPLIER
        - TECHNICAL_MANAGER_AND_TENANT
        - ANNOUNCEMENT

    ChatMessage:
      type: object
      required: [id, message, sent_at]
      properties:
        id:
          type: integer
          format: int64
        ticket_chat_id:
          type: integer
          format: int64
        message:
          type: string
        author:
          type: object
          nullable: true
          properties:
            name:
              type: string
              nullable: true
            profile_photo:
              type: string
              format: uri
              nullable: true
        sent_at:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: object
            required: [url, name]
            properties:
              url:
                type: string
                format: uri
              name:
                type: string
        mentions:
          type: array
          items:
            type: object
            required: [user_mentioned_id, mentioned_by_id]
            properties:
              user_mentioned_id:
                type: integer
                format: int64
              user_mentioned_full_name:
                type: string
                nullable: true
              mentioned_by_id:
                type: integer
                format: int64
