openapi: 3.0.3
info:
  title: FacilityDesk Client API
  version: "1.0"
  description: |
    FacilityDesk is a (fictional) SaaS platform used by facility managers to handle
    maintenance tickets for the buildings they operate. This is the read-only subset
    of the Client API relevant to the assignment.

    ## Authentication
    Exchange your `client_id` / `client_secret` for a bearer token at `POST /auth/token`.
    Tokens are valid for **30 minutes**. Requests with a missing or expired token
    return `401`.

    ## Rate limiting
    Every client is limited to **60 requests per minute** across all endpoints.
    Exceeding it returns `429 Too Many Requests` with a `Retry-After` header (seconds).

    ## Pagination
    Paginated endpoints return an envelope with `data`, `links` and `meta`.
    `links.next` is the absolute URL of the next page, or `null` on the last page.

    ## Behaviour you should know about
    - `GET /tickets` returns tickets **newest first** (by `id` descending; ids are
      monotonically increasing). It has **no** filter on `updated_at` or `created_at`.
    - Ticket `updated_at` changes when a field of the ticket itself changes (e.g.
      `current_step`, `priority`). It does **not** change when activities or chat
      messages are added.
    - Tickets can be **deleted** by users. Deleted tickets disappear from `GET /tickets`,
      and `GET /tickets/{ticket_id}` and its sub-resources return `404`.
    - Tickets can move out of a closed state again (re-opened), but this is rare.
    - Chat messages do not contain the ticket id or the chat type; these are only known
      from the request path. Activity and chat message ids are globally unique.
    - Timestamps are ISO 8601 with an offset. Not all timestamps are in UTC.
    - Nullable fields may be `null` or omitted.

    ## Examples
    The response examples in this document were captured from production responses
    (anonymised). The schemas were written by the FacilityDesk team.

    ## Local mock
    You can serve this spec locally with
    `npx @stoplight/prism-cli mock openapi.yaml` (listens on http://127.0.0.1:4010).
    The mock is stateless and returns the examples below. Select a specific example
    or status code with the `Prefer` header, e.g. `Prefer: example=closed_ticket`
    or `Prefer: code=404`.
servers:
  - url: http://127.0.0.1:4010
    description: Local Prism mock
  - url: https://api.facilitydesk.example/client-api/v1
    description: Production (fictional)

tags:
  - name: Authorization
    description: Obtain bearer tokens.
  - name: Buildings
    description: Buildings (a.k.a. assets) the client has access to.
  - name: Tickets
    description: Maintenance tickets and their activities and chat messages.

# Shared example payloads, referenced below via YAML aliases.
