[project]
name = "facilitydesk-sync"
version = "0.1.0"
description = "Keeps a SQL database in sync with the FacilityDesk ticket API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tzdata>=2024.1", # IANA time zones on platforms without a system tz database (Windows, slim containers)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# This is an application (and an Azure Functions app), not a library: no build step needed.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
